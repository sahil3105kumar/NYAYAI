[project]
name = "nyayai"
version = "0.1.0"
description = "Legal Intelligence & Document Audit System"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # ------------------------
    # OCR
    # ------------------------
    "pdfplumber",
    "pdf2image==1.17.0",
    "surya-ocr==0.9.3",
    # ------------------------
    # ML
    # ------------------------
    "transformers==4.48.0",
    "datasets==4.0.0",
    "accelerate==1.13.0",
    "seqeval==1.2.2",
    "evaluate==0.4.6",
    "sentence-transformers==5.1.0",
    # ------------------------
    # Vector DB
    # ------------------------
    "qdrant-client==1.17.1",
    # ------------------------
    # Backend
    # ------------------------
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.12",
    # ------------------------
    # Settings
    # ------------------------
    "pydantic==2.8.2",
    "pydantic-settings==2.5.2",
    # ------------------------
    # Background Jobs
    # ------------------------
    "celery==5.4.0",
    # Filesystem result backend
    "sqlalchemy>=2.0.51",
    "greenlet>=3.5.3",
    # ------------------------
    # Graph RAG & LLM Agent
    # ------------------------
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-mistralai>=0.2.0",
    "langchain-neo4j>=0.2.0",
    "langchain-experimental>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "neo4j>=5.0.0",
    "pymupdf4llm>=0.0.10",
    "python-dotenv>=1.0.0",
    # ------------------------
    # Utilities
    # ------------------------
    "rapidfuzz>=3.14.5",
    "spacy>=3.8.14",
    "pyspellchecker>=0.8.1",
    "pypdf",
    "reportlab",
    "pytest",
    "dvc>=3.67.1",
    "httpx>=0.28.1",
    "requests>=2.31.0",
    "nltk>=3.10.1",
]
[tool.uv]
override-dependencies = ["onnxruntime<1.24"]

[tool.uv.sources]
torch = { url = "https://download.pytorch.org/whl/cu124/torch-2.4.0+cu124-cp310-cp310-linux_x86_64.whl" }
torchvision = { url = "https://download.pytorch.org/whl/cu124/torchvision-0.19.0+cu124-cp310-cp310-linux_x86_64.whl" }

[tool.pytest.ini_options]
pythonpath = [
  "."
]
